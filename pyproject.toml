[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reels-editor"
version = "1.3.4.1"
description = "Локальный AI-монтажёр вертикальных Reels"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
  "openai==3.3.1",
  "faster-whisper==1.2.1",
  "tenacity==9.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["external: requires an installed external renderer or API"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["node_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
exclude = "node_tools|tests"
